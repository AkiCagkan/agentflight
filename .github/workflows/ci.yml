name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: python -m unittest discover -s tests -t . -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -e ".[test]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Panel in a real browser
        run: python tests/panel_browser_test.py
      - name: VS Code extension against the real panel
        run: python -m unittest tests.vscode_unit_test -v
      - name: Build the VS Code extension
        run: python scripts/build_vsix.py
      - name: Build the Python package
        run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
